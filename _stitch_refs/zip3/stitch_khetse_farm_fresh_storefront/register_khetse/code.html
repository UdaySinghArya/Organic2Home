e-4xl": "48px", "space-2xl": "32px", "container-max": "1080px", "space-md": "16px" }, "fontFamily": { "label-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "price-num": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"] }, "fontSize": { "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "800" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-md": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "700" }], "price-num": ["18px", { "lineHeight": "22px", "fontWeight": "800" }], "display-lg-mobile": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-sm": ["17px", { "lineHeight": "22px", "fontWeight": "600" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#f0fdf0;font-family:'Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen pt-safe pb-safe selection:bg-primary-fixed selection:text-on-primary-fixed" style="background-color: rgb(255, 248, 238);"><main class="flex-1 flex flex-col relative w-full px-gutter-mobile bg-surface max-w-[420px] mx-auto" style="background-color: rgb(255, 248, 238);"><div class="flex flex-col w-full pb-space-3xl">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between py-space-sm">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-lowest text-on-surface shadow-sm active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center gap-space-xs">
<div class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center bg-surface-container-lowest shadow-sm">
<img alt="KhetSe logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UYmDuoK8U5oonuU_dTJIAG78p1uNkvRSmPgwuTXjmXs5Eyx1uKRO5t_Du4t9Da7u0MVZqIjPuRE4qlcLa6FlZcW_M6c-sC1nbzQi44CcrXx3AOTlr_jTHaacKly6n0wh6Km-pq30n_8gBFYgQSrQlXOLHH-zhoxgr8yiwEXTOWx7QdlWixsEABvhNLy0xUg5sMHP1iltQk2UU0_ht_8hm0Cy5xa4oBZLdothwpnmI3n1a62fXW9OGlx1U8">
</div>
<span class="font-headline-sm text-headline-sm text-primary tracking-tight">KhetSe</span>
</div>
<div class="w-10 h-10"></div>
</div>
<!-- Editorial Headline Section -->
<div class="mt-space-md mb-space-lg">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Create Account</h1>

</div>
<!-- Main Sign-Up Form Card -->
<div class="bg-surface-container-lowest rounded-[20px] p-space-xl shadow-sm flex flex-col gap-space-lg">
<form class="flex flex-col gap-space-lg" id="registerForm" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">person</span>
<input class="w-full h-12 pl-11 pr-4 rounded-full bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="fullName" name="fullName" placeholder="e.g. Ramesh Sharma" type="text">
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="phoneNumber">Phone Number</label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center gap-1 text-on-surface font-label-md text-label-md select-none pointer-events-none">
<span class="">+91</span>
<span class="w-[1px] h-4 bg-outline-variant ml-1"></span>
</div>
<input class="w-full h-12 pl-16 pr-4 rounded-full bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="phoneNumber" maxlength="10" name="phoneNumber" placeholder="98765 43210" type="tel">
</div>

</div>
<!-- Harvest Timing Guarantee Card -->
<div class="bg-surface-container-low rounded-[16px] p-space-md flex flex-col gap-space-xs"><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[18px] text-primary">schedule</span><span class="font-label-md text-label-md text-on-surface">Tomorrow morning delivery, 7–10 AM</span></div></div>
<!-- Primary Action CTA -->
<button class="w-full h-12 rounded-full bg-secondary text-on-secondary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md active:scale-[0.98] transition-transform mt-space-xs" id="submitBtn" type="submit">
<span class="">Create account</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Trust & Value Proposition Badges -->

<!-- Footer Navigation / Account Switch -->
<div class="mt-space-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      Already have an account? 
      <a class="font-label-md text-label-md text-primary hover:underline ml-1" href="#">Sign in</a>
</p>
</div>
</div>
<script>
  (function() {
    const phoneInput = document.getElementById('phoneNumber');
    if (phoneInput) {
      phoneInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '');
      });
    }

    const form = document.getElementById('registerForm');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        if (btn) {
          const originalText = btn.innerHTML;
          btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">sync</span><span>Connecting to farm...</span>';
          setTimeout(() => {
            btn.innerHTML = originalText;
          }, 1500);
        }
      });
    }
  })();
</script></main>

</body></html>
