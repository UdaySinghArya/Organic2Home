<script>
  (function initOtpTimer() {
    let timeLeft = 45;
    const badge = document.getElementById('timer-badge');
    const resendBtn = document.getElementById('resend-btn');

    if (!badge || !resendBtn) return;

    const interval = setInterval(() => {
      timeLeft -= 1;
      if (timeLeft <= 0) {
        clearInterval(interval);
        badge.textContent = '(0:00)';
        badge.classList.add('opacity-40');
        resendBtn.classList.remove('opacity-60');
      } else {
        const sec = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        badge.textContent = `(0:${sec})`;
      }
    }, 1000);
  })();
