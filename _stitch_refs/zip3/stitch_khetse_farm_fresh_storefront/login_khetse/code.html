<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">

e-4xl": "48px", "space-2xl": "32px", "container-max": "1080px", "space-md": "16px" }, "fontFamily": { "label-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "price-num": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"] }, "fontSize": { "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "800" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-md": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "700" }], "price-num": ["18px", { "lineHeight": "22px", "fontWeight": "800" }], "display-lg-mobile": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-sm": ["17px", { "lineHeight": "22px", "fontWeight": "600" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#f0fdf0;font-family:'Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface font-body-md flex flex-col min-h-screen pt-safe pb-safe selection:bg-primary-fixed selection:text-on-primary-fixed" style="background-color: rgb(255, 248, 238);"><main class="flex-1 flex flex-col relative w-full px-gutter-mobile max-w-[420px] mx-auto"><div class="flex flex-col w-full pb-space-2xl">
<!-- Top Navigation & Brand Header -->
<div class="flex items-center justify-between py-space-sm mb-space-md">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-lowest shadow-sm text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center gap-space-xs">
<div class="w-9 h-9 rounded-full overflow-hidden bg-surface-container-lowest p-1 shadow-sm flex items-center justify-center">
<img alt="KhetSe Logo" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/AEtjO1UYmDuoK8U5oonuU_dTJIAG78p1uNkvRSmPgwuTXjmXs5Eyx1uKRO5t_Du4t9Da7u0MVZqIjPuRE4qlcLa6FlZcW_M6c-sC1nbzQi44CcrXx3AOTlr_jTHaacKly6n0wh6Km-pq30n_8gBFYgQSrQlXOLHH-zhoxgr8yiwEXTOWx7QdlWixsEABvhNLy0xUg5sMHP1iltQk2UU0_ht_8hm0Cy5xa4oBZLdothwpnmI3n1a62fXW9OGlx1U8">
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-extrabold">Khet<span class="text-primary">Se</span></span>
</div>
<!-- Invisible placeholder for optical balance -->
<div class="w-10 h-10"></div>
</div>
<!-- Editorial Headline Section -->
<div class="flex flex-col gap-space-2xs mb-space-xl">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">
      Welcome back
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
      Enter your phone number to manage tomorrow's harvest delivery
    </p>
</div>
<!-- Form Card Container -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-space-xl shadow-md flex flex-col gap-space-lg">
<!-- Phone Input Block -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="phone-input">
        Mobile Phone Number
      </label>
<div class="relative flex items-center w-full bg-surface-container-low rounded-full px-space-md py-3.5 transition-all focus-within:bg-surface-container-lowest focus-within:shadow-sm">
<!-- Leading Icon -->
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5 select-none">call</span>
<!-- Country Prefix -->
<span class="font-label-md text-label-md text-on-surface font-bold pr-2 select-none">
          +91
        </span>
<div class="w-px h-5 bg-outline-variant mr-3"></div>
<!-- Phone Field -->
<input class="w-full bg-transparent font-price-num text-price-num text-on-surface placeholder:text-outline/60 focus:outline-none tracking-wide" id="phone-input" inputmode="numeric" maxlength="10" pattern="[0-9]*" placeholder="98765 43210" type="tel">
<!-- Clear Button (Micro-interaction) -->
<button class="hidden text-outline hover:text-on-surface p-1 rounded-full" id="clear-btn" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
<!-- Friendly Gentle Warning / Helper Notice -->
<div class="flex items-center gap-1.5 px-space-sm pt-0.5 text-secondary" id="phone-feedback">
<span class="material-symbols-outlined text-[16px] text-secondary">info</span>
<span class="font-body-sm text-body-sm">Please enter a valid 10-digit mobile number</span>
</div>
</div>
<!-- Primary CTA: Harvest Orange Pill -->
<div class="flex flex-col gap-space-md pt-space-xs">
<button class="w-full h-[52px] rounded-full bg-secondary-container text-on-primary-container font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:opacity-95 active:scale-[0.98] transition-all" id="submit-cta" type="button">
<span class="">Send OTP</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Account Switcher Link -->
<div class="text-center pt-1">
<p class="font-body-md text-body-md text-on-surface-variant">
          New to KhetSe?
          <button class="font-label-lg text-label-lg text-primary hover:underline ml-1 inline-flex items-center align-baseline" type="button">
            Create account
          </button>
</p>
</div>
</div>
</div>
<!-- Farm Assurance Trust Badges (Moments of Delight) -->

</div>
<script>
  (function() {
    const input = document.getElementById('phone-input');
    const clearBtn = document.getElementById('clear-btn');
    const feedback = document.getElementById('phone-feedback');
    const submitBtn = document.getElementById('submit-cta');

    if (!input || !clearBtn || !feedback || !submitBtn) return;

    input.addEventListener('input', (e) => {
      // Numbers only
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 10) value = value.slice(0, 10);
      e.target.value = value;

      if (value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      // Live feedback warmth
      if (value.length === 10) {
        feedback.classList.add('opacity-0', 'pointer-events-none');
        submitBtn.classList.add('scale-[1.01]');
      } else {
        feedback.classList.remove('opacity-0', 'pointer-events-none');
        submitBtn.classList.remove('scale-[1.01]');
      }
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      clearBtn.classList.add('hidden');
      feedback.classList.remove('opacity-0', 'pointer-events-none');
      input.focus();
    });

    submitBtn.addEventListener('click', () => {
      const val = input.value.trim();
      if (val.length < 10) {
        // Playful nudge on invalid tap
        feedback.classList.remove('opacity-0');
        input.parentElement.classList.add('animate-pulse');
        setTimeout(() => {
          input.parentElement.classList.remove('animate-pulse');
        }, 500);
        input.focus();
      } else {
        // Satisfying micro-state
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
          <span>Connecting to Harvest...</span>
        `;
      }
    });
  })();
</script></main>

</body></html>
