<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail - Tomato (Out of Stock) - KhetSe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas: '#FFF8EE',
          ink: '#1F2A22',
          leaf: '#2F8F4E',
          harvest: '#F06A3A',
          sun: '#F5C542'
        },
        fontFamily: {
          sans: ['Plus Jakarta Sans', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #FFF8EE;
    color: #1F2A22;
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body class="min-h-screen bg-canvas text-ink flex flex-col justify-between max-w-[390px] mx-auto relative pb-28">

  <!-- Top Navigation Bar -->
  <header class="pt-6 px-5 pb-3 flex items-center justify-between sticky top-0 bg-canvas/90 backdrop-blur-md z-30">
    <button aria-label="Go back" class="w-11 h-11 rounded-full bg-white flex items-center justify-center shadow-sm border border-stone-100 hover:bg-stone-50 transition-colors">
      <svg class="w-5 h-5 text-ink" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold tracking-wider text-stone-500 uppercase bg-stone-200/60 px-3 py-1 rounded-full">Harvest Booked Out</span>
    </div>
    <div class="w-11"></div> <!-- Spacer for optical balance -->
  </header>

  <!-- Main Content -->
  <main class="px-5 pt-1 space-y-5">
    
    <!-- Big Produce Image Card with Grayscale treatment -->
    <div class="bg-white rounded-[20px] p-5 shadow-sm border border-stone-200/70 relative overflow-hidden flex flex-col items-center">
      <!-- Back Tomorrow Chip -->
      <div class="absolute top-4 left-4 z-10 bg-stone-200 text-stone-700 font-bold text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-stone-500"></span>
        Back tomorrow
      </div>
      
      <div class="w-full aspect-square rounded-[16px] overflow-hidden bg-stone-100 flex items-center justify-center relative my-2">
        <img src="https://lh3.googleusercontent.com/aida/AEtjO1USsJTs1mJDwTx06vyz7U90E3LfosMgosLpCQPB36R0QKgfS3eNLy8XVCE9nu_UnkPSR9T7MkR7Bcs7JkIV-5a28NW8A47uC-rbtrT7uj70NSjmhrkT9Sii_he0BINH4qW9aBkBfIXP6-nM7eNv98UEkwwH8pf65uVRJE6upGkjKbNHrGdsYh0fily0dcmRjzfRj13k-Rsqzczd5pw-gI9s_pCClYFLkXAQc4GOBKym-eCIxZAe42IG82sv" alt="Fresh Farm Tomato" class="w-full h-full object-cover grayscale opacity-75">
      </div>
      
      <div class="flex items-center gap-2 self-start mt-2">
        <span class="inline-block w-2 h-2 rounded-full bg-amber-500"></span>
        <span class="text-xs font-semibold text-stone-600">Daily harvest quota reached for 6 Sep</span>
      </div>
    </div>

    <!-- Title & Attributes Card -->
    <div class="bg-white rounded-[20px] p-6 shadow-sm border border-stone-200/70 space-y-3">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-stone-800">Tomato</h1>
        <p class="text-base font-semibold text-stone-500 mt-0.5">Vegetable · ₹40 / kg</p>
      </div>

      <p class="text-sm font-medium text-stone-500 leading-relaxed border-t border-stone-100 pt-3">
        Picked tomorrow morning from our field
      </p>

      <!-- Out of Stock message box -->
      <div class="bg-stone-50 rounded-xl p-3.5 border border-stone-100 flex items-start gap-2.5 text-xs text-stone-600">
        <span class="text-base">🧺</span>
        <div>
          <p class="font-bold text-stone-800">Farmer Ramesh has finished today's picking book.</p>
          <p class="text-stone-500 mt-0.5">Tomorrow evening's harvest order will open tomorrow at 8:00 AM.</p>
        </div>
      </div>
    </div>

    <!-- Disabled Gray Stepper Card -->
    <div class="bg-white rounded-[20px] p-5 shadow-sm border border-stone-200/70 flex items-center justify-between opacity-60">
      <div class="space-y-0.5">
        <span class="text-xs font-bold text-stone-400 uppercase tracking-wider">Select Weight</span>
        <p class="text-xs text-stone-400">Min 0.5 kg</p>
      </div>

      <!-- Disabled Stepper Controls -->
      <div class="flex items-center bg-stone-100 rounded-full p-1.5 gap-4">
        <button disabled class="w-11 h-11 rounded-full bg-stone-200 text-stone-400 font-bold text-xl flex items-center justify-center cursor-not-allowed">
          −
        </button>
        <div class="w-16 text-center">
          <span class="text-xl font-extrabold text-stone-400">1 kg</span>
        </div>
        <button disabled class="w-11 h-11 rounded-full bg-stone-200 text-stone-400 font-bold text-xl flex items-center justify-center cursor-not-allowed">
          +
        </button>
      </div>
    </div>

  </main>

  <!-- Disabled Sticky Button -->
  <div class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto p-4 bg-canvas/95 backdrop-blur-md border-t border-stone-200/70 z-40">
    <button disabled class="w-full py-4 rounded-full bg-stone-300 text-stone-500 font-bold text-lg flex items-center justify-center gap-2 cursor-not-allowed shadow-none">
      <span>Not picking today</span>
    </button>
  </div>

</body>
</html>
