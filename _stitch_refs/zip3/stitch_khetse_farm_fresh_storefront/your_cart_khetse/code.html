r w-6 h-6 rounded-full hover:bg-black/5 active:scale-95" type="button"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14" stroke-linecap="round"></path></svg></button><span class="qty-display text-[14px] font-bold text-[#131e16] min-w-[32px] text-center" data-val="1">1 kg</span><button aria-label="Increase" class="stepper-btn plus text-[#131e16] flex items-center justify-center w-6 h-6 rounded-full hover:bg-black/5 active:scale-95" type="button"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"></path></svg></button></div><button aria-label="Remove" class="remove-btn text-[#6f7a6e] hover:text-[#a93707] p-1.5 flex items-center justify-center rounded-full transition-colors" type="button"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div></div></div><div class="bg-white rounded-[20px] p-5 shadow-sm mt-1"><div class="flex items-center justify-between"><span class="text-[17px] font-semibold text-[#131e16]">Total</span><span class="text-[22px] font-extrabold text-[#131e16]" id="bill-grand-total">₹200</span></div></div></div>
<!-- Sticky Bottom Bar for Checkout -->
<div class="sticky bottom-16 w-full z-40 bg-[#FFF8EE]/90 backdrop-blur-xl px-gutter-mobile py-3 flex justify-center"><button class="w-full max-w-container-max h-12 bg-secondary-container text-on-primary font-bold text-[16px] rounded-full shadow-md hover:brightness-105 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="checkout-cta" type="button"><span id="checkout-label" class="">Checkout ₹200</span><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14m-6-6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
<!-- Client-side Interactive Logic -->
<script>
    (function() {
      // Highlight Cart in Bottom Nav
      const navLinks = document.querySelectorAll('nav a');
      navLinks.forEach(link => {
        if (link.getAttribute('data-path') === 'cart') {
          link.classList.remove('text-on-surface-variant');
          link.classList.add('text-primary', 'font-label-md');
          const icon = link.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.style.fontVariationSettings = "'FILL' 1";
          }
        }
      });

      // Recalculate totals
      function updateTotals() {
        const items = document.querySelectorAll('.cart-item');
        let total = 0;
        let count = 0;

        items.forEach(item => {
          const rate = parseFloat(item.dataset.rate) || 0;
          const qtySpan = item.querySelector('.qty-display');
          const qty = parseInt(qtySpan.dataset.val, 10) || 0;
          total += rate * qty;
          count += qty;

          const rateText = item.querySelector('.item-rate-text');
          if (rateText) {
            rateText.textContent = `${qty} kg · ₹${rate * qty}`;
          }
        });

        const itemsTotalEl = document.getElementById('bill-items-total');
        const grandTotalEl = document.getElementById('bill-grand-total');
        const bottomPriceEl = document.getElementById('bottom-bar-price');
        const checkoutLabel = document.getElementById('checkout-label');
        const checkoutBtn = document.getElementById('checkout-cta');

        if (itemsTotalEl) itemsTotalEl.textContent = `₹${total}`;
        if (grandTotalEl) grandTotalEl.textContent = `₹${total}`;
        if (bottomPriceEl) bottomPriceEl.textContent = `₹${total}`;
        if (checkoutLabel) checkoutLabel.textContent = `Checkout ₹${total}`;

        if (count === 0 && checkoutBtn) {
          checkoutBtn.classList.add('opacity-50', 'pointer-events-none');
          if (checkoutLabel) checkoutLabel.textContent = 'Cart is empty';
        } else if (checkoutBtn) {
          checkoutBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
      }

      // Handle stepper clicks
      document.querySelectorAll('.cart-item').forEach(item => {
        const minusBtn = item.querySelector('.stepper-btn.minus');
        const plusBtn = item.querySelector('.stepper-btn.plus');
        const removeBtn = item.querySelector('.remove-btn');
        const qtySpan = item.querySelector('.qty-display');

        if (plusBtn) {
          plusBtn.addEventListener('click', () => {
            let current = parseInt(qtySpan.dataset.val, 10);
            if (current < 15) {
              current += 1;
              qtySpan.dataset.val = current;
              qtySpan.textContent = `${current} kg`;
              updateTotals();
            }
          });
        }

        if (minusBtn) {
          minusBtn.addEventListener('click', () => {
            let current = parseInt(qtySpan.dataset.val, 10);
            if (current > 1) {
              current -= 1;
              qtySpan.dataset.val = current;
              qtySpan.textContent = `${current} kg`;
              updateTotals();
            } else if (current === 1) {
              item.style.transition = 'all 0.25s ease-out';
              item.style.opacity = '0';
              item.style.transform = 'translateX(-12px)';
              setTimeout(() => {
                item.remove();
                updateTotals();
              }, 250);
            }
          });
        }

        if (removeBtn) {
          removeBtn.addEventListener('click', () => {
            item.style.transition = 'all 0.25s ease-out';
            item.style.opacity = '0';
            item.style.transform = 'scale(0.95)';
            setTimeout(() => {
              item.remove();
              updateTotals();
            }, 250);
          });
        }
      });
    })();
  </script>
