<path d="M12 20v2"></path>
<path d="m4.93 4.93 1.41 1.41"></path>
<path d="m17.66 17.66 1.41 1.41"></path>
<path d="M2 12h2"></path>
<path d="M20 12h2"></path>
<path d="m6.34 17.66-1.41 1.41"></path>
<path d="m19.07 4.93-1.41 1.41"></path>
</svg>
<p class="font-body-md text-body-md text-on-surface-variant font-medium">
          For tomorrow morning's farm delivery, 7–10 AM
        </p>
</div>
<form class="flex flex-col gap-space-md" id="addressForm" onsubmit="event.preventDefault(); handleSave();">
<div class="flex flex-col rounded-DEFAULT bg-surface-container-low p-space-sm transition-colors focus-within:bg-surface-container">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-2xs" for="fullName">

<input class="w-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline outline-none" id="fullName" name="name" placeholder="e.g. Riya Sharma" required="" type="text"/>
</div>
<div class="flex flex-col rounded-DEFAULT bg-surface-container-low p-space-sm transition-colors focus-within:bg-surface-container">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-2xs" for="phoneNumber">
            Phone number
          </label>
<input class="w-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline outline-none" id="phoneNumber" name="phone" placeholder="+91 98765 43210" required="" type="tel"/>
</div>
<div class="flex flex-col rounded-DEFAULT bg-surface-container-low p-space-sm transition-colors focus-within:bg-surface-container">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-2xs" for="houseDetails">

            Village / Area / City
          </label>

</div>
<div class="flex items-start gap-space-xs mt-space-2xs px-space-2xs">
<svg class="w-4 h-4 text-primary shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
<circle cx="12" cy="10" r="3"></circle>
</svg>
<p class="font-body-sm text-body-sm text-on-surface-variant">
            We currently deliver to all morning cluster zones within 35 km.
          </p>
</div>
<button class="mt-space-lg w-full h-12 rounded-full bg-secondary text-on-secondary font-label-lg text-label-lg flex items-center justify-center shadow-md active:scale-[0.99] transition-all hover:opacity-95 cursor-pointer" id="submitBtn" type="submit">

        </button>
</form>
</div>
<div class="hidden opacity-0 transition-opacity duration-300 flex items-center justify-center gap-space-xs p-space-sm bg-primary-container text-on-primary-container rounded-full text-center font-label-md text-label-md" id="toastSuccess">
<svg class="w-5 h-5 text-on-primary-container" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
<span>Address saved for dawn harvest route!</span>
</div>
</div>
</div>
<script>
  function handleSave() {
    const btn = document.getElementById('submitBtn');
    const toast = document.getElementById('toastSuccess');
    
    btn.disabled = true;
    btn.innerText = 'Confirming route...';
    
    setTimeout(() => {
      btn.innerText = 'Address Saved';
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.remove('opacity-0');
      }, 10);
      
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        }
      }, 1200);
    }, 600);
  }
</script></main></body></html>
