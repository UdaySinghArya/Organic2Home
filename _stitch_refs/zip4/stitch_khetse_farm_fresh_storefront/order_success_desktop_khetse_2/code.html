<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FFF8EE;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: "#2F8F4E",
            "harvest-orange": "#F06A3A",
            cream: "#FFF8EE"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#FFF8EE] font-sans text-[#131e16] antialiased min-h-screen flex flex-col justify-between">
<!-- Desktop Header -->
<header class="w-full bg-[#FFF8EE]/90 backdrop-blur-md border-b border-[#ebdcc8]/50">
<div class="max-w-[960px] mx-auto px-6 h-20 flex items-center justify-between">
<div class="flex items-center gap-3">
<img alt="KhetSe logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UYmDuoK8U5oonuU_dTJIAG78p1uNkvRSmPgwuTXjmXs5Eyx1uKRO5t_Du4t9Da7u0MVZqIjPuRE4qlcLa6FlZcW_M6c-sC1nbzQi44CcrXx3AOTlr_jTHaacKly6n0wh6Km-pq30n_8gBFYgQSrQlXOLHH-zhoxgr8yiwEXTOWx7QdlWixsEABvhNLy0xUg5sMHP1iltQk2UU0_ht_8hm0Cy5xa4oBZLdothwpnmI3n1a62fXW9OGlx1U8"/>
<span class="text-xl font-extrabold text-[#2F8F4E] tracking-tight">KhetSe</span>
</div>
<nav class="flex items-center gap-8">
<a class="text-sm font-semibold text-[#5a6b5d] hover:text-[#131e16] transition-colors" data-path="harvest-market" href="#">Harvest Market</a>
<a aria-current="page" class="text-sm font-bold bg-[#2F8F4E] text-white px-4 py-1.5 rounded-full" data-path="orders" href="#">Orders</a>
<a class="text-sm font-semibold text-[#5a6b5d] hover:text-[#131e16] transition-colors" data-path="cart" href="#">Cart</a>
<a class="text-sm font-semibold text-[#5a6b5d] hover:text-[#131e16] transition-colors" data-path="profile" href="#">Profile</a>
</nav>
<div class="flex items-center">
<div class="w-9 h-9 rounded-full bg-[#2F8F4E] flex items-center justify-center text-white">
<span class="material-symbols-outlined text-[18px]">person</span>
</div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="w-full flex-1 flex flex-col items-center justify-center px-4 py-12 md:py-16">
<div class="w-full max-w-[960px] mx-auto flex flex-col items-center text-center">
<!-- Centered Leaf Check Illustration -->
<div class="w-28 h-28 md:w-32 md:h-32 mb-6 rounded-3xl overflow-hidden bg-[#FFF8EE] flex items-center justify-center shadow-[0_8px_24px_rgba(47,143,78,0.08)]">
<img alt="Leaf Checkmark Confirmation" class="w-full h-full object-contain p-2" src="https://lh3.googleusercontent.com/aida/AEtjO1VOQ3sgzY5czPkGZqn_PKNBVOO2AXqjlzmv2XcJSFlf17mGUFPAZZ1s3Czn7tt4RcL98z4QcYrAnvmLfW_MpL8BBUeHYcy2bUVCUVeGktOuXtA3o3d1D1VRnomz_j4eFI9J3keOQz0UvpRWndv7TMtItJGJKRWVVcrq3FRVnOosex2RPIHcIhQMkeYq-KTEL9-jCG3QBzcPycF_yMolDdAvWlSyXd3aaF5daNRBuU8SraEhBKDPTYt5KFw"/>
</div>
<!-- Headline & Order Pill -->
<h1 class="text-3xl md:text-4xl font-extrabold text-[#131e16] tracking-tight mb-3">
        Booked for tomorrow
      </h1>
<div class="inline-flex items-center gap-2 bg-[#ecdcc6]/40 px-3.5 py-1 rounded-full mb-8">
<span class="w-2 h-2 rounded-full bg-[#2F8F4E]"></span>
<span class="text-xs font-bold text-[#2F8F4E] tracking-wide">Order #KS-104</span>
</div>
<!-- Single White 20px Card (max-w-md mx-auto) -->
<div class="w-full max-w-md bg-white rounded-[20px] p-6 shadow-[0_4px_24px_rgba(60,40,10,0.06)] border border-[#ede3d5] text-left flex flex-col gap-4">
<!-- Items -->
<div class="flex flex-col gap-3 pb-3 border-b border-[#f2ede4]">
<div class="flex items-center justify-between text-sm">
<span class="font-medium text-[#131e16]">Tomato 2 kg</span>
<span class="font-bold text-[#131e16]">₹80</span>
</div>
<div class="flex items-center justify-between text-sm">
<span class="font-medium text-[#131e16]">Mango 1 kg</span>
<span class="font-bold text-[#131e16]">₹120</span>
</div>
</div>
<!-- Total -->
<div class="flex items-center justify-between py-1">
<span class="font-extrabold text-base text-[#131e16]">Total</span>
<span class="font-extrabold text-xl text-[#2F8F4E]">₹200</span>
</div>
<!-- 1 Short Line Field Note -->
<div class="bg-[#f5fbf6] border border-[#d9ecd9] rounded-xl px-3.5 py-2.5">
<p class="text-xs text-[#2F8F4E] font-medium leading-relaxed">
            We pick this from the field tomorrow morning
          </p>
</div>
<!-- Clean Arrival Line -->
<div class="bg-[#faf6ef] rounded-xl px-3.5 py-2.5 flex items-center justify-between text-xs">
<span class="text-[#6d6458] font-medium">Estimated Arrival</span>
<span class="font-bold text-[#131e16]">Tomorrow 7–10 AM</span>
</div>
<!-- Buttons / Actions -->
<div class="pt-2 flex flex-col items-center gap-3">
<a class="w-full h-11 bg-[#F06A3A] hover:bg-[#d9582a] text-white rounded-full font-bold text-sm flex items-center justify-center transition-all shadow-[0_4px_14px_rgba(240,106,58,0.3)]" data-path="orders" href="#">
            View order
          </a>
<a class="text-xs font-semibold text-[#2F8F4E] hover:underline transition-colors py-1" data-path="harvest-market" href="#">
            Back to shop
          </a>
</div>
</div>
</div>
</main>
<!-- Clean Minimal Footer -->
<footer class="w-full py-8 text-center text-xs text-[#8c8273]">
<div class="max-w-[960px] mx-auto px-6">
      © 2025 KhetSe Produce Co.
    </div>
</footer>
</body></html>
