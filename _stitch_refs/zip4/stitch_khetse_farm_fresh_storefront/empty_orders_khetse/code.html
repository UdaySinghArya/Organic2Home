<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #FFF8EE;
      }
      body {
        overscroll-behavior-y: none;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#FFF8EE] text-[#1F2A22] flex flex-col min-h-screen antialiased selection:bg-[#F06A3A]/20">
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pb-28 pt-12 text-center w-full max-w-md mx-auto">
<!-- Empty Basket Illustration -->
<div class="relative w-64 h-64 sm:w-72 sm:h-72 mb-8 flex items-center justify-center">
<img alt="Empty rustic woven wicker basket" class="w-full h-full object-contain select-none" src="https://lh3.googleusercontent.com/aida/AEtjO1XkpYMrhJHnrfxKp-R0LlhDxQRQlOSAUx9iFYE3CppaA3wPo70aOIujqS2nsPqpp6Mh36205llQP6N28N3tQWos6vOdvmM5aarS8BJKBmjbU_viK9SbmgnIH-TQR4PugLdZNyBv6ZTGQotH0Nuobg1DmoXCMo3UEjejAn7zJHu-18mj-YlkTE5phH53LA5JsnLBN1yiSoAfh1zjTR1wo4HzMQDYIVYQ3Hvrl9VL5vUP2CqCi32WdGmWmjI"/>
</div>
<!-- Title & Helper Copy -->
<h1 class="text-2xl sm:text-[28px] font-bold text-[#1F2A22] tracking-tight leading-tight mb-2">
      No orders yet
    </h1>
<p class="text-[15px] text-[#1F2A22]/70 font-normal leading-relaxed mb-8 max-w-[260px]">
      Order today for tomorrow's dawn delivery.
    </p>
<!-- Harvest Orange Pill CTA -->
<a class="inline-flex items-center justify-center px-8 h-13 py-3.5 bg-[#F06A3A] hover:bg-[#e25c2c] active:scale-[0.98] text-white font-semibold text-[15px] rounded-full shadow-[0_6px_20px_rgba(240,106,58,0.28)] transition-all duration-150 cursor-pointer" href="#">
      Shop today's produce
    </a>
</main>
<!-- Clean Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 w-full bg-[#FFF8EE]/95 backdrop-blur-md border-t border-[#1F2A22]/5 pb-safe z-50">
<div class="flex justify-around items-center h-16 max-w-md mx-auto px-4">
<!-- Home -->
<a class="flex flex-col items-center justify-center min-w-[56px] py-1 text-[#1F2A22]/50 hover:text-[#1F2A22] transition-colors" href="#">
<svg class="w-6 h-6 mb-1 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"></path>
</svg>
<span class="text-[11px] font-medium tracking-tight leading-none">Home</span>
</a>
<!-- Cart -->
<a class="flex flex-col items-center justify-center min-w-[56px] py-1 text-[#1F2A22]/50 hover:text-[#1F2A22] transition-colors" href="#">
<svg class="w-6 h-6 mb-1 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2z"></path>
<line x1="3" x2="21" y1="6" y2="6"></line>
<path d="M16 10a4 4 0 0 1-8 0"></path>
</svg>
<span class="text-[11px] font-medium tracking-tight leading-none">Cart</span>
</a>
<!-- Orders (Active) -->
<a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] py-1 text-[#2F8F4E] transition-colors font-bold" href="#">
<svg class="w-6 h-6 mb-1 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
<line x1="16" x2="8" y1="13" y2="13"></line>
<line x1="16" x2="8" y1="17" y2="17"></line>
<line x1="10" x2="8" y1="9" y2="9"></line>
</svg>
<span class="text-[11px] font-bold tracking-tight leading-none">Orders</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center min-w-[56px] py-1 text-[#1F2A22]/50 hover:text-[#1F2A22] transition-colors" href="#">
<svg class="w-6 h-6 mb-1 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="8" r="4"></circle>
<path d="M20 21a8 8 0 0 0-16 0"></path>
</svg>
<span class="text-[11px] font-medium tracking-tight leading-none">Profile</span>
</a>
</div>
</nav>
</body></html>
